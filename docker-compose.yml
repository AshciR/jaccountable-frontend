services:
  frontend:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env.development
    environment:
      PORT: '3000'
      ORIGIN: 'http://localhost:3000'
      # Browser-reachable URL — localhost resolves on the host machine
      PUBLIC_API_BASE_URL: 'http://localhost:8000'
      # Container-reachable URL for SSR — localhost inside Docker refers to the container,
      # not the host, so we use host.docker.internal to escape to the host machine
      INTERNAL_API_BASE_URL: 'http://host.docker.internal:8000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
