name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'scripts/**'

jobs:
  # ---
  # CI — Continuous Integration
  # Run lint, type check, tests, and build on every push and pull request to main.
  # ---

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate SvelteKit files
        run: npx svelte-kit sync

      - name: Lint
        run: yarn lint

      - name: Type check
        run: yarn run check

  test-and-build:
    runs-on: ubuntu-latest

    env:
      PUBLIC_POSTHOG_KEY: 'phc_fake_key_for_ci'
      PUBLIC_POSTHOG_API_HOST: 'https://doesnotmatter.com'
      PUBLIC_USE_REAL_API: false # not used during CI. Only applicable for local development
      PUBLIC_SENTRY_DSN: 'fake-dsn-for-ci'
      PUBLIC_API_BASE_URL: 'https://doesnotmatter.com'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate SvelteKit files
        run: npx svelte-kit sync

      - name: Run tests
        run: yarn test

      - name: Build
        run: yarn build

  # ---
  # CD — Continuous Deployment
  # Build and push the Docker image, then trigger a deploy on Render.
  # Only runs on pushes to main (not pull requests).
  # ---

  docker-publish:
    needs: [lint-and-typecheck, test-and-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.sha-tag.outputs.tag }}
      lower_repo: ${{ steps.lower-repo.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository
        id: lower-repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.lower-repo.outputs.repo }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract short SHA tag
        id: sha-tag
        run: |
          REVISION=$(echo '${{ steps.meta.outputs.json }}' | jq -r '.labels["org.opencontainers.image.revision"]')
          echo "tag=sha-${REVISION:0:7}" >> $GITHUB_OUTPUT

      - name: Log image metadata
        run: |
          echo "short_sha: ${{ steps.sha-tag.outputs.tag }}"
          echo "tags: ${{ steps.meta.outputs.tags }}"
          echo "labels: ${{ steps.meta.outputs.labels }}"

  deploy:
    needs: [docker-publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Trigger Render staging deploy
        id: trigger
        env:
          deploy_url: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK_URL }}
        run: |
          TRIGGERED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf "$deploy_url"
          echo "triggered_at=${TRIGGERED_AT}" >> $GITHUB_OUTPUT

      - name: Poll for staging deploy to go live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
          TRIGGERED_AT: ${{ steps.trigger.outputs.triggered_at }}
        run: |
          TRIGGERED_EPOCH=$(date -d "$TRIGGERED_AT" +%s)
          for i in $(seq 1 30); do
            RESPONSE=$(curl -sf \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys?limit=1")
            STATUS=$(echo "$RESPONSE" | jq -r '.[0].deploy.status')
            CREATED=$(echo "$RESPONSE" | jq -r '.[0].deploy.createdAt')
            CREATED_EPOCH=$(date -d "$CREATED" +%s)
            echo "Attempt ${i}/30: status=${STATUS} createdAt=${CREATED}"
            if [ "$CREATED_EPOCH" -ge "$TRIGGERED_EPOCH" ]; then
              case "$STATUS" in
                live) echo "Staging is live!"; exit 0 ;;
                build_failed|update_failed|pre_deploy_failed|canceled)
                  echo "Deploy failed: ${STATUS}"; exit 1 ;;
              esac
            fi
            sleep 30
          done
          echo "Timed out waiting for staging deploy"; exit 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag image as staging
        env:
          IMAGE_BASE: ghcr.io/${{ needs.docker-publish.outputs.lower_repo }}
          SHA_TAG: ${{ needs.docker-publish.outputs.short_sha }}
        run: |
          docker pull ${IMAGE_BASE}:${SHA_TAG}
          docker tag  ${IMAGE_BASE}:${SHA_TAG} ${IMAGE_BASE}:staging
          docker push ${IMAGE_BASE}:staging
